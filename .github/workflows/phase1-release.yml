name: Phase 1 release gate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase1-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_ARTIFACT_DECLARATIONS: ${{ vars.RELEASE_ARTIFACT_DECLARATIONS }}

jobs:
  # Job 1: Generate the trusted-artifact manifest and build the WebUI.
  # This runs on Linux and produces the signed manifest that all build
  # jobs need to bundle into the desktop package.
  trust-and-webui:
    runs-on: ubuntu-latest
    outputs:
      manifest-hash: ${{ steps.manifest-hash.outputs.hash }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            webui/package-lock.json
            desktop/package-lock.json
            docs/package-lock.json

      - name: Install WebUI dependencies
        run: npm ci --prefix webui

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Install docs dependencies
        run: npm ci --prefix docs

      - name: Build Docusaurus docs
        run: npm run build --prefix docs

      - name: Require release artifact declarations
        env:
          DECLARATIONS: ${{ env.RELEASE_ARTIFACT_DECLARATIONS }}
        run: |
          test -n "$DECLARATIONS" || { echo 'Set the RELEASE_ARTIFACT_DECLARATIONS repository variable to a JSON array of {reference,url,path} entries.' >&2; exit 1; }
          printf '%s' "$DECLARATIONS" > release-artifacts.json
          node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('release-artifacts.json','utf8')); if (!Array.isArray(v)||!v.length||v.some(x=>!x.reference||!x.url||!x.path||!String(x.url).startsWith('https://'))) process.exit(1);"

      - name: Stage declared release artifacts
        run: node desktop/scripts/stage-release-artifacts.js --input release-artifacts.json

      - name: Verify publisher Minisign public key
        run: test -s desktop/resources/trusted-artifacts-public-key.pem

      - name: Install Minisign (for encrypted key signing)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign

      - name: Generate detached Minisign trusted artifact manifest
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.MINISIGN_PRIVATE_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          test -n "$MINISIGN_PRIVATE_KEY" || { echo 'MINISIGN_PRIVATE_KEY secret is required.' >&2; exit 1; }
          node desktop/scripts/generate-trusted-artifact-manifest.js \
            --out desktop/resources/trusted-artifacts.json \
            --signature desktop/resources/trusted-artifacts.json.minisig \
            --private-key-env MINISIGN_PRIVATE_KEY \
            --artifact-list release-artifacts.json
          rm -f release-artifacts.json

      - name: Verify detached Minisign manifest
        run: node desktop/scripts/verify-trusted-artifact-manifest.js --manifest desktop/resources/trusted-artifacts.json --public-key desktop/resources/trusted-artifacts-public-key.pem --signature desktop/resources/trusted-artifacts.json.minisig

      - name: Build WebUI
        run: npm run build --prefix webui

      - name: Collect explicit Phase 1 evidence
        run: node desktop/scripts/collect-phase1-release-evidence.js

      - name: Upload trusted manifest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trusted-manifest
          path: |
            desktop/resources/trusted-artifacts.json
            desktop/resources/trusted-artifacts.json.minisig

      - name: Upload WebUI build
        uses: actions/upload-artifact@v4
        with:
          name: webui-build
          path: public/

      - name: Upload docs build
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: docs/build/

      - name: Upload Phase 1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase1-evidence
          path: artifacts/phase1-evidence/

      - name: Manifest hash
        id: manifest-hash
        run: echo "hash=$(sha256sum desktop/resources/trusted-artifacts.json | cut -d' ' -f1)" >> $GITHUB_OUTPUT

  # Job 2: Build Linux deb package
  build-linux:
    needs: trust-and-webui
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            webui/package-lock.json
            desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Download trusted manifest
        uses: actions/download-artifact@v4
        with:
          name: trusted-manifest
          path: desktop/resources/

      - name: Download WebUI build
        uses: actions/download-artifact@v4
        with:
          name: webui-build
          path: public/

      - name: Download docs build
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs/build/

      - name: Build JCM (optional)
        run: cd desktop && npm run build:jcm

      - name: Copy WebUI build
        run: cd desktop && npm run copy-webui

      - name: Copy docs
        run: cd desktop && npm run copy-docs

      - name: Build Linux deb package
        run: cd desktop && npm run build:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: desktop/release/*.deb

  # Job 3: Build Windows NSIS installer and portable exe
  build-windows:
    needs: trust-and-webui
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            webui/package-lock.json
            desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Download trusted manifest
        uses: actions/download-artifact@v4
        with:
          name: trusted-manifest
          path: desktop/resources/

      - name: Download WebUI build
        uses: actions/download-artifact@v4
        with:
          name: webui-build
          path: public/

      - name: Download docs build
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs/build/

      - name: Build JCM (optional)
        run: cd desktop && npm run build:jcm

      - name: Copy WebUI build
        run: cd desktop && npm run copy-webui

      - name: Copy docs
        run: cd desktop && npm run copy-docs

      - name: Build Windows NSIS installer
        run: cd desktop && npx electron-builder --win nsis

      - name: Build Windows portable exe
        run: cd desktop && npx electron-builder --win portable

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            desktop/release/Alpacabitollama-Setup-*.exe
            desktop/release/Alpacabitollama-Portable-*.exe

  # Job 4: Collect evidence and publish the GitHub release with all artifacts
  publish:
    needs: [trust-and-webui, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            webui/package-lock.json
            desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Download trusted manifest
        uses: actions/download-artifact@v4
        with:
          name: trusted-manifest
          path: desktop/resources/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: desktop/release/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: desktop/release/

      - name: Download Phase 1 evidence
        uses: actions/download-artifact@v4
        with:
          name: phase1-evidence
          path: artifacts/phase1-evidence/

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            desktop/release/Alpacabitollama-Setup-*.exe
            desktop/release/Alpacabitollama-Portable-*.exe
            desktop/release/*.deb
            desktop/resources/trusted-artifacts.json
            desktop/resources/trusted-artifacts.json.minisig
            artifacts/phase1-evidence/release-results.json
          fail_on_unmatched_files: false
