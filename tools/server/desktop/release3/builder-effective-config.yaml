directories:
  output: release3
  buildResources: resources
appId: com.ggml.llamacpp
productName: alpacabitollama
files:
  - filter:
      - main.js
      - preload.js
      - build-webui.js
      - public/**/*
      - bin/**/*
      - resources/**/*
      - '*.html'
      - node_modules/**/*
      - package.json
asarUnpack:
  - public/**/*
  - bin/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: resources/alpaca.ico
extraFiles:
  - from: resources/vc_redist.x64.exe
    to: vc_redist.x64.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: true
  artifactName: Alpacabitollama-Setup.exe
  include: installer.nsh
portable:
  artifactName: Alpacabitollama-Portable-Setup.exe
electronVersion: 41.2.2
